version: 2
updates:
  # Dependabot uses the npm ecosystem for pnpm manifests and lockfiles.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # The install template has its own package.json and pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/templates/cloudflare"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
